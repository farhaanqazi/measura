# Local Supabase project config (consumed by `supabase` CLI).
# A real project_id is filled in once you run `supabase link --project-ref <id>`.
project_id = "measura"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.external.google]
enabled = false

[edge_runtime]
enabled = true
